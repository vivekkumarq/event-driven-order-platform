# Test profile: everything the tests need runs in-process. No broker, no database server.
spring:
  datasource:
    url: jdbc:h2:mem:inventory-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    admin:
      # Do not try to reach a broker at startup to create topics; tests that need topics use
      # @EmbeddedKafka, which creates them itself.
      auto-create: false
    listener:
      # Individual integration tests re-enable this once an embedded broker is running.
      auto-startup: false

platform:
  inventory:
    reservation:
      max-attempts: 5
      backoff-ms: 5

logging:
  level:
    com.vivek.platform.inventory: DEBUG
    org.apache.kafka: WARN
    kafka: WARN
