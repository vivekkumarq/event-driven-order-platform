# Single source of configuration truth for inventory-service.
# Every value can be overridden by the environment variable named in the default expression;
# see .env.example at the repository root for the full list.

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: inventory-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1}
    username: ${DATASOURCE_USERNAME:sa}
    password: ${DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:inventory-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: RECORD

platform:
  kafka:
    topics:
      order-created: ${TOPIC_ORDER_CREATED:order-created-topic}
      order-cancelled: ${TOPIC_ORDER_CANCELLED:order-cancelled-topic}
      inventory-reservation-result: ${TOPIC_INVENTORY_RESERVATION_RESULT:inventory-reservation-result-topic}
    retry:
      # Redeliveries after the first failure, after which the record goes to <topic>.DLT
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
  inventory:
    reservation:
      # Attempts, including the first, before an optimistic locking conflict is given up on
      max-attempts: ${RESERVATION_MAX_ATTEMPTS:5}
      backoff-ms: ${RESERVATION_BACKOFF_MS:25}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: inventory-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.vivek.platform.inventory: ${LOG_LEVEL:INFO}

---
# PostgreSQL-backed profile, used by docker compose.
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventorydb}
    driver-class-name: org.postgresql.Driver
    username: ${DATASOURCE_USERNAME:inventory}
    password: ${DATASOURCE_PASSWORD:inventory}

  jpa:
    # Schema is still generated by Hibernate. Versioned migrations (Flyway) are on the roadmap;
    # until then this must stay 'update' rather than 'validate'.
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false
