name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.module }})
    runs-on: ubuntu-latest

    strategy:
      # Report both modules even when one of them fails.
      fail-fast: false
      matrix:
        module: [order-service, inventory-service]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          # Caches ~/.m2/repository keyed on the pom files.
          cache: maven

      - name: Build and test ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        # No -DskipTests: the whole point of this job is that the tests run. The suite
        # includes @EmbeddedKafka integration tests, which start a broker in-process and
        # need no services on the runner.
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
