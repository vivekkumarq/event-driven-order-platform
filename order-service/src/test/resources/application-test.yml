# Test profile: everything the tests need runs in-process. No broker, no database server.
spring:
  datasource:
    url: jdbc:h2:mem:order-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    admin:
      # Do not try to reach a broker at startup to create topics; tests that need topics use
      # @EmbeddedKafka, which creates them itself.
      auto-create: false
    listener:
      # Individual integration tests re-enable this once an embedded broker is running.
      auto-startup: false

platform:
  outbox:
    # Tests drive the relay explicitly so assertions are deterministic.
    enabled: false
    poll-interval-ms: 60000

logging:
  level:
    com.vivek.platform.order: DEBUG
    org.apache.kafka: WARN
    kafka: WARN
    org.apache.zookeeper: WARN
