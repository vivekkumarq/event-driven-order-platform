# Single source of configuration truth for order-service.
# Every value can be overridden by the environment variable named in the default expression;
# see .env.example at the repository root for the full list.

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: order-service

  datasource:
    url: ${DATASOURCE_URL:jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1}
    username: ${DATASOURCE_USERNAME:sa}
    password: ${DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:order-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: RECORD

platform:
  kafka:
    topics:
      order-created: ${TOPIC_ORDER_CREATED:order-created-topic}
      order-cancelled: ${TOPIC_ORDER_CANCELLED:order-cancelled-topic}
      inventory-reservation-result: ${TOPIC_INVENTORY_RESERVATION_RESULT:inventory-reservation-result-topic}
    retry:
      # Redeliveries after the first failure, after which the record goes to <topic>.DLT
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: order-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.vivek.platform.order: ${LOG_LEVEL:INFO}

---
# PostgreSQL-backed profile, used by docker compose.
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderdb}
    driver-class-name: org.postgresql.Driver
    username: ${DATASOURCE_USERNAME:orders}
    password: ${DATASOURCE_PASSWORD:orders}

  jpa:
    # Schema is still generated by Hibernate. Versioned migrations (Flyway) are on the roadmap;
    # until then this must stay 'update' rather than 'validate'.
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false
